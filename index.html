```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EVM Address Fetcher</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0d111b;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      width: 100%;
      max-width: 380px;
      padding: 24px;
      background: #171e2d;
      border-radius: 16px;
      box-sizing: border-box;
    }

    h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #625bff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #address {
      margin-top: 18px;
      padding: 12px;
      background: #0d111b;
      border-radius: 8px;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    #status {
      margin-top: 14px;
      color: #bac4d6;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="card">
    <h2>EVM Address Fetcher</h2>

    <p>Fetch an already-authorized wallet address.</p>

    <button id="fetchBtn">Fetch Address</button>

    <div id="address" hidden></div>
    <div id="status" role="status">Ready.</div>
  </main>

  <script>
    const fetchBtn = document.getElementById("fetchBtn");
    const addressBox = document.getElementById("address");
    const statusBox = document.getElementById("status");

    fetchBtn.addEventListener("click", async () => {
      if (!window.ethereum) {
        statusBox.textContent =
          "No compatible EVM wallet provider detected. Open this page in your wallet browser.";
        return;
      }

      fetchBtn.disabled = true;
      statusBox.textContent = "Checking authorized accounts...";
      addressBox.hidden = true;

      try {
        // Does not request new wallet permissions.
        const accounts = await window.ethereum.request({
          method: "eth_accounts"
        });

        if (!accounts || accounts.length === 0) {
          statusBox.textContent =
            "No authorized account is available. The wallet must grant access before this DApp can read its address.";
          return;
        }

        addressBox.textContent = accounts[0];
        addressBox.hidden = false;
        statusBox.textContent = "Address fetched successfully.";

      } catch (error) {
        statusBox.textContent =
          "Could not read accounts: " + (error.message || "Unknown error");
      } finally {
        fetchBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
