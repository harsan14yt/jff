```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet Diagnostic</title>
</head>
<body>
  <h3>Trust Wallet Diagnostic</h3>
  <button id="checkBtn">Check Wallet</button>
  <pre id="result">Tap the button to check.</pre>

  <script>
    document.getElementById("checkBtn").onclick = async () => {
      const output = document.getElementById("result");
      output.textContent = "Checking...";

      try {
        output.textContent =
          "window.ethereum: " + typeof window.ethereum + "\n" +
          "ethereum providers: " +
          (window.ethereum?.providers?.length ?? "not reported") + "\n";

        if (!window.ethereum) {
          output.textContent +=
            "\nNo EVM provider detected in this page.";
          return;
        }

        const accounts = await window.ethereum.request({
          method: "eth_accounts"
        });

        output.textContent +=
          "\neth_accounts result: " + JSON.stringify(accounts) +
          "\n\n" +
          (accounts.length
            ? "Address: " + accounts[0]
            : "No account currently exposed to this DApp.");

      } catch (error) {
        output.textContent +=
          "\nError: " + (error.message || String(error));
      }
    };
  </script>
</body>
</html>
